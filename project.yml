name: Silver
options:
  bundleIdPrefix: com.silver
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Automatic
targets:
  Silver:
    type: application
    platform: macOS
    sources:
      - Silver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silver.git
        PRODUCT_NAME: Silver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Silver
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Silver
        INFOPLIST_KEY_LSMinimumSystemVersion: '26.0'
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Silver:
    build:
      targets:
        Silver: all
    run:
      config: Debug
